  <title>Cordoba Panel Mapping</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    
    #grid {
    background-position: left top;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    /* opacity: var(--grid-opacity); */
    pointer-events: none;
    position: absolute;
    left: 0;
    top: 0;
      width: 1920px;
      height: 1080px;
    }
    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      cursor: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #panels {
      position: absolute;
      inset: 0;
      perspective: 10vh;
      
      width: 1920px;
      height: 1080px;
        margin-left: 4px;
    }

    .panel {
      position: absolute;
      min-width: 2px;
      min-height: 2px;
      background: #ff0000;
      opacity: 0.5;
      transform-origin: left top;
      box-shadow:inset 0px 0px 0px 1px black;
      margin-top:57px;
      z-index:2
      
    }
