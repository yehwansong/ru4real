<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cordoba Panel Mapping</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    #grid {
    background-image: url(grid.jpg);
    background-position: left top;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    /* opacity: var(--grid-opacity); */
    pointer-events: none;
    position: absolute;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #panels {
      position: absolute;
      inset: 0;
      perspective: 10vh
    }

    .panel {
      position: absolute;
      min-width: 2px;
      min-height: 2px;
      background: #ff0000;
      opacity: 0.5;
      transform-origin: left top
      
    }

    .panel:nth-child(1)  {
    left: 58.1%;
    top: 4.9%;
    width: 5.97%;
    height: 10.4%;}
    .panel:nth-child(2)  {
    left: 54%;
    top: 16.6%;
    width: 2.4%;
    height: 5.4%;
    TRANSFORM: SKEWY(1DEG);}
    .panel:nth-child(3)  {
    left: 58%;
    top: 16.4%;
    width: 2.666667%;
    height: 5.5%;}
    .panel:nth-child(4)  {
    left: 63.2%;
    top: 16.3%;
    width: 2.9%;
    height: 5.6%;}
    .panel:nth-child(5)  {
    left: 48.55%;
    top: 28.6%;
    width: 2.5%;
    height: 6.5%;
    transform: skewX(-1deg);}
    .panel:nth-child(6)  {
    left: 57.8%;
    top: 28.5%;
    width: 3.7%;
    height: 7%;
    transform: rotate(-2deg);}
    .panel:nth-child(7)  {
    left: 52.5%;
    top: 28.6%;
    width: 3.45%;
    height: 6.7%;}
    .panel:nth-child(8)  {

    width: 3.1%;

}

}

    height: 7.5%;

    .panel:nth-child(12) {
    left: 45.95%;
    top: 39.6%;
    width: 3.2%;

    .panel:nth-child(13) {    left: 50.9%;

    .panel:nth-child(14) {

    .panel:nth-child(15) {

    /*.panel:nth-child(17) { left: 68%;        top: 47.5%; width: 4%;        height: 7.5%; }*/

    /*.panel:nth-child(24) { left: 86.666667%; top: 52.5%; width: 5.333333%; height: 10%; }*/

    left: 73.2%;
    top: 77%;
    width: 5.333333%;
    height: 12.5%;
    TRANSFORM: SKEWX(1deg) skewY(-4deg);}
  </style>
</head>
